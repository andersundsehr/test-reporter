services:
  test-reporter:
    image: ghcr.io/andersundsehr/test-reporter:${TEST_REPORTER_IMAGE_TAG:-main}
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: ${TEST_REPORTER_VIRTUAL_HOST:?TEST_REPORTER_VIRTUAL_HOST is required}
      VIRTUAL_PORT: '3099'
    expose:
      - '3099'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3099/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: proxy-tier
    external: true
