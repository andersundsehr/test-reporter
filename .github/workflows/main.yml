name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/andersundsehr/test-reporter
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp install.sh templates/gitlab-ci.yml README.md dist/
          cd dist
          sha256sum test-reporter.cjs install.sh gitlab-ci.yml > SHA256SUMS
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
      - name: Configure deployment SSH
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/test-reporter-deploy"
          chmod 600 "$HOME/.ssh/test-reporter-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy main image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST repository variable}"
          : "${DEPLOY_PORT:?Missing DEPLOY_PORT repository variable}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER repository variable}"
          ssh -i "$HOME/.ssh/test-reporter-deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p "$HOME/docker/test-reporter"'
          scp -i "$HOME/.ssh/test-reporter-deploy" -P "$DEPLOY_PORT" compose.yml .env.dist \
            "$DEPLOY_USER@$DEPLOY_HOST:docker/test-reporter/"
          ssh -i "$HOME/.ssh/test-reporter-deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -eu; cd "$HOME/docker/test-reporter"; test -f .env || { echo "Missing $HOME/docker/test-reporter/.env" >&2; exit 1; }; docker compose pull; docker compose up -d --remove-orphans'
